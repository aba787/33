<body>
    <a href="index.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H6m0 0l6 6m-6-6l6-6"/>
        </svg>
        العودة للرئيسية
    </a>

    <div class="login-container">
        <div class="brand-section">
            <div class="brand-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h2 class="login-title">مرحباً بعودتك</h2>
            <p class="login-subtitle">قم بتسجيل الدخول للوصول إلى حسابك</p>
        </div>

        <div class="error-message" id="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <span class="btn-text">تسجيل الدخول</span>
            </button>
        </form>

        <div class="extra-links">
            <a href="#" onclick="showComingSoon()">نسيت كلمة المرور؟</a>
            <a href="register.html">إنشاء حساب جديد</a>
        </div>

        <script>
            function showComingSoon() {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #f59e0b;
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 0.75rem;
                    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                    z-index: 1000;
                    font-weight: 500;
                `;
                notification.textContent = "ميزة قريباً! 🚀";
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        </script>
    </div>

    <script src="Firebase.js"></script>
